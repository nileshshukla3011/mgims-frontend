# Security headers for every response of the website and the console (FRS WEB-SEC-3, WEB-SEC-7; GIGW 3.0).
# Included in each location below, because an add_header inside a location replaces the server-level ones.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Voice search uses the microphone; nothing else needs device access.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Scripts, styles and fonts come only from this site (fonts are self-hosted). Photos still load from the old site
# until they are copied (VITE_MEDIA_BASE_URL): replace https://www.mgims.ac.in in img-src with that host then.
# Add the API's origin to connect-src if it is not served from /api on this host, and VITE_MONITORING_URL if set.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://www.mgims.ac.in; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
