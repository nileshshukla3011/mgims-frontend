# Example nginx configuration for the MGIMS website (dist/) and its admin console (dist-admin/). Adjust server names,
# certificate paths, the backend address and the console's allowed networks. Build with `npm run build` first.

# The backend (REST API). Both apps call it at /api on their own host, so cookies stay same-origin and no CORS is needed.
upstream mgims_api {
    server 127.0.0.1:5000;
}

# Old website addresses (index.php/...) answer 301 to their new pages (FRS WEB-ENG-3). The map is generated by
# scripts/generate-legacy-redirects.mjs; copy docs/legacy-redirects.nginx.conf next to this file.
include /etc/nginx/conf.d/legacy-redirects.nginx.conf;
map $request_uri $mgims_request_lc {
    # Lower-case keys: if the old links were all lower case, $request_uri is enough; otherwise lower-case it here
    # with the njs or lua module.
    default $request_uri;
}

server {
    listen 80;
    server_name www.mgims.ac.in mgims.ac.in;
    return 301 https://www.mgims.ac.in$request_uri;
}

# ---------------------------------------------------------------- Public website
server {
    listen 443 ssl http2;
    server_name www.mgims.ac.in;
    root /var/www/mgims/dist;

    ssl_certificate     /etc/ssl/mgims/fullchain.pem;
    ssl_certificate_key /etc/ssl/mgims/privkey.pem;
    ssl_protocols TLSv1.3;                         # FRS WEB-PAY-5, WEB-SEC-3

    if ($mgims_legacy_target) {
        return 301 $mgims_legacy_target;
    }

    location /api/ {
        proxy_pass http://mgims_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Source maps are kept out of the build (vite.config.ts); refuse them anyway.
    location ~* \.map$ {
        return 404;
    }

    # Hashed file names: cache for a year.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages: each known address has its own pre-rendered index.html (title, description and link-preview tags for
    # search engines and link previews); any other address gets the app, which shows its own "page not found".
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }
}

# ---------------------------------------------------------------- Admin console (its own host)
server {
    listen 443 ssl http2;
    server_name admin.mgims.ac.in;                 # an internal name is better
    root /var/www/mgims/dist-admin;

    ssl_certificate     /etc/ssl/mgims/fullchain.pem;
    ssl_certificate_key /etc/ssl/mgims/privkey.pem;
    ssl_protocols TLSv1.3;

    # Reachable from the institute's network only (example ranges).
    # allow 10.0.0.0/8;
    # deny all;

    location /api/ {
        proxy_pass http://mgims_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every console section has its own address (/approvals, /inquiries, …); all of them load the app.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
